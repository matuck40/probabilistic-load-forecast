name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks lists the PR's commits

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.4
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is not tested: the pinned numpy==2.5.3 requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # The CPU build of the pinned torch: the CUDA build from PyPI is several GB,
      # and no test run here imports torch.
      - name: Install
        run: |
          pip install "$(grep '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      # Deselected on CI, not deleted:
      #   slow        - needs the Chronos model weights, downloaded from Hugging Face
      #   integration - needs data/raw, downloaded from ONS by `make data`
      # The second step of `make test` (the slow Chronos group) does not run here
      # for the same reason; run it locally with `make test`.
      - name: Test
        run: python -m pytest -q -m "not slow and not integration"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
